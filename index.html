<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SereenMedia — Rust in een digitale wereld</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f9fafb;
            color: #111827;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 2rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            color: #166534;
            text-decoration: none;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }
        .hero {
            max-width: 700px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 3.5rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.03);
        }
        .badge {
            display: inline-block;
            background: #f0fdf4;
            color: #166534;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
            border: 1px solid #bbf7d0;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #111827;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        p {
            font-size: 1.05rem;
            color: #4b5563;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: #166534;
            color: #ffffff;
            font-weight: 700;
            padding: 0.85rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(22, 101, 52, 0.2);
        }
        .btn:hover {
            background-color: #14532d;
        }
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.8rem;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">SereenMedia.</a>
    </header>

    <main>
        <div class="hero">
            <span class="badge">Binnenkort online</span>
            <h1>Ruimte voor kwaliteit en rust.</h1>
            <p>SereenMedia ontwikkelt redactionele platformen en digitale concepten waarin focus, helderheid en beleving centraal staan. Zoals het rustzoekersplatform StilteSpot.</p>
            <a href="mailto:info@sereenmedia.nl" class="btn">Neem contact op</a>
        </div>
    </main>

    <footer>
        &copy; 2026 SereenMedia. Alle rechten voorbehouden.
    </footer>

</body>
</html>
